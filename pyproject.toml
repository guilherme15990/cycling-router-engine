[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roteamento-com-ml"
version = "0.18.0"
description = "Roteamento ciclavel com ML: aproveita o motor (grafo OSM, fisica, busca) e o enriquece com dados"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dem = ["rasterio>=1.3", "numpy>=1.24"]
dev = ["pytest>=8"]

[project.scripts]
roteamento = "cli:main"

[tool.setuptools]
py-modules = [
    "api",
    "cli",
    "elevation",
    "elevation_tiles",
    "envelope",
    "geo",
    "offline",
    "planning",
    "snapping",
]

[tool.setuptools.packages.find]
where = ["src"]

# PEP 561: o pacote distribui tipos inline; o marcador ``py.typed`` precisa
# acompanhar cada pacote instalado.
[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
