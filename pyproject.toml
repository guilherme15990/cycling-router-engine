[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roteamento-com-ml"
version = "0.18.0"
description = "Roteamento ciclavel com ML: aproveita o motor (grafo OSM, fisica, busca) e o enriquece com dados"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dem = ["rasterio>=1.3", "numpy>=1.24"]
dev = ["pytest>=8"]

[project.scripts]
roteamento = "router.interfaces.cli:main"
router = "router.interfaces.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["__main__"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["router*"]

# PEP 561: o pacote distribui tipos inline; o marcador ``py.typed`` precisa
# acompanhar cada pacote instalado.
[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
